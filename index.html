<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Secret ♡</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(180deg, #ffeef5 0%, #fff8fb 100%);
        font-family: "Segoe UI", sans-serif;
        overflow: hidden;
        color: #5d4650;
    }

    .page {
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        overflow: hidden;
    }

    /* =========================
       BACKGROUND CLOUDS
    ========================= */

    .cloud {
        position: absolute;
        font-size: 55px;
        opacity: 0.8;
        pointer-events: none;
        user-select: none;
        animation: cloudFloat 8s ease-in-out infinite;
    }

    .cloud.one {
        top: 8%;
        left: 5%;
        animation-delay: 0s;
    }

    .cloud.two {
        top: 15%;
        right: 8%;
        font-size: 45px;
        animation-delay: 2s;
    }

    .cloud.three {
        top: 38%;
        left: -10px;
        font-size: 38px;
        animation-delay: 4s;
    }

    @keyframes cloudFloat {
        0%, 100% {
            transform: translateX(0);
        }
        50% {
            transform: translateX(25px);
        }
    }

    /* =========================
       SUN
    ========================= */

    .sun {
        position: absolute;
        top: 30px;
        right: 12%;
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: #ffd86b;
        box-shadow: 0 0 35px rgba(255, 213, 91, 0.6);
        animation: sunPulse 4s ease-in-out infinite;
        pointer-events: none;
    }

    @keyframes sunPulse {
        0%, 100% {
            transform: scale(1);
        }
        50% {
            transform: scale(1.08);
        }
    }

    /* =========================
       MAIN BOX
    ========================= */

    .box {
        width: min(92%, 440px);
        max-height: 92vh;
        overflow: visible;
        background: rgba(255, 255, 255, 0.92);
        border-radius: 30px;
        padding: 28px 22px 25px;
        box-shadow:
            0 20px 60px rgba(194, 119, 145, 0.18),
            0 5px 15px rgba(194, 119, 145, 0.1);
        text-align: center;
        position: relative;
        z-index: 10;
        border: 2px solid rgba(255, 196, 215, 0.65);
        transition: transform 0.6s ease, opacity 0.6s ease;
    }

    .box::before {
        content: "";
        position: absolute;
        inset: 7px;
        border: 1px dashed rgba(230, 155, 180, 0.35);
        border-radius: 24px;
        pointer-events: none;
    }

    h1 {
        font-family: Georgia, serif;
        color: #d66d91;
        font-size: 30px;
        margin-bottom: 6px;
        position: relative;
        z-index: 2;
    }

    .subtitle {
        font-size: 13px;
        color: #a37c89;
        margin-bottom: 17px;
        position: relative;
        z-index: 2;
    }

    /* =========================
       CALENDAR
    ========================= */

    .calendar-wrap {
        position: relative;
        width: 100%;
        margin: 0 auto;
    }

    .calendar {
        width: 100%;
        background: #fffdfd;
        border-radius: 20px;
        padding: 15px 10px 13px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 8px 25px rgba(211, 136, 160, 0.12);
        border: 1px solid #f5d8e2;

        transition:
            transform 0.5s ease,
            box-shadow 0.5s ease;
    }

    /* paper rocket animation */
    .calendar.paper-rocket {
        animation: paperRocket 0.8s ease-in-out;
    }

    @keyframes paperRocket {
        0% {
            transform: translateX(0) rotate(0deg);
        }

        25% {
            transform: translateX(-7px) rotate(-1deg);
        }

        50% {
            transform: translateX(7px) rotate(1deg);
        }

        75% {
            transform: translateX(-4px) rotate(-0.5deg);
        }

        100% {
            transform: translateX(0) rotate(0deg);
        }
    }

    .month {
        font-family: Georgia, serif;
        font-size: 22px;
        color: #d86e93;
        margin-bottom: 10px;
        font-weight: bold;
    }

    .weekdays,
    .days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
    }

    .weekday {
        font-size: 10px;
        color: #b78b99;
        font-weight: bold;
        padding-bottom: 4px;
    }

    .day {
        height: 34px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 10px;
        font-size: 12px;
        color: #745761;
        cursor: pointer;
        position: relative;
        z-index: 3;
        transition:
            transform 0.2s ease,
            background 0.2s ease,
            color 0.2s ease;
        user-select: none;
    }

    .day:hover {
        transform: scale(1.1);
        background: #fff0f5;
    }

    .day.selected {
        background: #f29abb;
        color: white;
        font-weight: bold;
        transform: scale(1.08);
        box-shadow: 0 4px 10px rgba(229, 115, 157, 0.25);
    }

    .day.empty {
        cursor: default;
    }

    .day.empty:hover {
        transform: none;
        background: transparent;
    }

    /* =========================
       DECORATIONS ON CALENDAR
    ========================= */

    .scene {
        position: absolute;
        z-index: 5;
        pointer-events: none;
        user-select: none;
    }

    .calendar-sun {
        top: 7px;
        right: 20px;
        font-size: 25px;
        animation: tinySun 3s ease-in-out infinite;
    }

    @keyframes tinySun {
        0%, 100% {
            transform: rotate(0deg) scale(1);
        }
        50% {
            transform: rotate(12deg) scale(1.12);
        }
    }

    .calendar-cloud {
        font-size: 19px;
        opacity: 0.75;
        animation: tinyCloud 5s ease-in-out infinite;
    }

    .calendar-cloud.one {
        top: 40px;
        left: 17px;
    }

    .calendar-cloud.two {
        top: 72px;
        right: 12px;
        animation-delay: 1.5s;
    }

    @keyframes tinyCloud {
        0%, 100% {
            transform: translateX(0);
        }
        50% {
            transform: translateX(8px);
        }
    }

    .calendar-plane {
        top: 43px;
        right: 50px;
        font-size: 22px;
        transform: rotate(-8deg);
        animation: littlePlane 4s ease-in-out infinite;
    }

    @keyframes littlePlane {
        0%, 100% {
            transform: translate(0, 0) rotate(-8deg);
        }
        50% {
            transform: translate(12px, -6px) rotate(-5deg);
        }
    }

    .dog {
        bottom: 4px;
        left: 15px;
        font-size: 24px;
        animation: dogBounce 3s ease-in-out infinite;
    }

    @keyframes dogBounce {
        0%, 100% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(-4px);
        }
    }

    .tree {
        bottom: 3px;
        right: 13px;
        font-size: 27px;
        animation: treeMove 4s ease-in-out infinite;
    }

    @keyframes treeMove {
        0%, 100% {
            transform: rotate(-2deg);
        }
        50% {
            transform: rotate(2deg);
        }
    }

    /* FLOWER MOVED NEAR DATE 9 */
    .flower-one {
        left: 19%;
        top: 88px;
        font-size: 23px;
        animation: flowerFloat 3s ease-in-out infinite;
    }

    @keyframes flowerFloat {
        0%, 100% {
            transform: translateY(0) rotate(-3deg);
        }
        50% {
            transform: translateY(-4px) rotate(4deg);
        }
    }

    /* COW NEAR DATE 1 */
    .cow {
        left: 3%;
        top: 53px;
        font-size: 21px;
        animation: cowMove 4s ease-in-out infinite;
    }

    @keyframes cowMove {
        0%, 100% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(-3px) rotate(2deg);
        }
    }

    /* =========================
       QUESTION
    ========================= */

    .question {
        margin-top: 17px;
        font-family: Georgia, serif;
        font-size: 15px;
        color: #805967;
        position: relative;
        z-index: 3;
    }

    .question strong {
        color: #d76f93;
    }

    /* =========================
       COLOR OPTIONS
    ========================= */

    .colors {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 10px;
        position: relative;
        z-index: 5;
    }

    .color-option {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid white;
        box-shadow: 0 2px 8px rgba(120, 80, 90, 0.15);
        cursor: pointer;
        transition: transform 0.2s ease;
        position: relative;
    }

    .color-option:hover {
        transform: scale(1.12);
    }

    .color-option.selected {
        outline: 3px solid #e58aa8;
        transform: scale(1.1);
    }

    .color-pink {
        background: #f49ab8;
    }

    .color-blue {
        background: #9dc9ef;
    }

    .color-yellow {
        background: #f8d978;
    }

    .color-white {
        background: white;
        border: 1px solid #ddd;
    }

    /* =========================
       ERROR MESSAGE
    ========================= */

    .message {
        min-height: 21px;
        margin-top: 8px;
        font-size: 12px;
        color: #d47796;
        position: relative;
        z-index: 5;
    }

    .message.shake {
        animation: shake 0.4s ease;
    }

    @keyframes shake {
        0%, 100% {
            transform: translateX(0);
        }
        25% {
            transform: translateX(-5px);
        }
        50% {
            transform: translateX(5px);
        }
        75% {
            transform: translateX(-3px);
        }
    }

    /* =========================
       AIRPLANE CONTROL
    ========================= */

    .plane-area {
        width: 100%;
        margin-top: 18px;
        position: relative;
        z-index: 20;
    }

    .plane-track {
        width: 100%;
        height: 58px;
        border-radius: 30px;
        background: linear-gradient(
            90deg,
            rgba(255, 221, 232, 0.75),
            rgba(255, 241, 247, 0.8)
        );
        border: 1px dashed #efb8cb;
        position: relative;
        overflow: hidden;
    }

    .plane-track::before {
        content: "♡  •  •  •  •  •  •  ♡";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: rgba(216, 110, 147, 0.22);
        font-size: 12px;
        letter-spacing: 5px;
        white-space: nowrap;
        pointer-events: none;
    }

    .drag-plane {
        position: absolute;
        left: 8px;
        top: 50%;
        transform: translateY(-50%) rotate(-5deg);
        width: 52px;
        height: 45px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 34px;
        cursor: grab;
        touch-action: none;
        user-select: none;
        z-index: 5;

        transition:
            left 1.15s cubic-bezier(.22, .61, .36, 1),
            transform 0.2s ease;
    }

    .drag-plane:hover {
        transform: translateY(-50%) rotate(-5deg) scale(1.08);
    }

    .drag-plane.dragging {
        cursor: grabbing;
        transition: none;
        transform: translateY(-50%) rotate(-3deg) scale(1.1);
    }

    .plane-shadow {
        position: absolute;
        width: 28px;
        height: 5px;
        border-radius: 50%;
        background: rgba(194, 119, 145, 0.18);
        bottom: 8px;
        left: 18px;
        filter: blur(2px);
    }

    /* IMPORTANT:
       No "<- drag" text here anymore.
    */

    .plane-message {
        margin-top: 5px;
        font-size: 10px;
        color: #b78b99;
        opacity: 0.8;
    }

    /* =========================
       DECORATIVE BOTTOM ITEMS
    ========================= */

    .bottom-heart {
        position: absolute;
        bottom: 10%;
        left: 8%;
        font-size: 25px;
        animation: heartFloat 4s ease-in-out infinite;
        pointer-events: none;
    }

    @keyframes heartFloat {
        0%, 100% {
            transform: translateY(0) rotate(-5deg);
        }
        50% {
            transform: translateY(-8px) rotate(5deg);
        }
    }

    /* =========================
       FADE OUT
    ========================= */

    .box.leaving {
        opacity: 0;
        transform: scale(0.95) translateY(-10px);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 480px) {
        .box {
            padding: 23px 15px 20px;
            border-radius: 25px;
        }

        h1 {
            font-size: 26px;
        }

        .calendar {
            padding: 13px 7px 11px;
        }

        .day {
            height: 31px;
            font-size: 11px;
        }

        .flower-one {
            left: 18%;
            top: 84px;
        }

        .cow {
            left: 2%;
            top: 50px;
        }

        .calendar-plane {
            right: 40px;
        }

        .plane-track {
            height: 55px;
        }

        .drag-plane {
            width: 48px;
            font-size: 31px;
        }
    }
</style>
</head>

<body>

<div class="page">

    <!-- BACKGROUND -->
    <div class="cloud one">☁️</div>
    <div class="cloud two">☁️</div>
    <div class="cloud three">☁️</div>

    <div class="sun"></div>

    <div class="bottom-heart">♡</div>

    <!-- MAIN -->
    <div class="box" id="mainBox">

        <h1>A Little Secret ♡</h1>

        <div class="subtitle">
            There is something waiting for you...
        </div>

        <div class="calendar-wrap">

            <div class="calendar" id="calendar">

                <div class="month">February 2026</div>

                <!-- CALENDAR DECORATIONS -->

                <div class="scene calendar-sun">☀️</div>

                <div class="scene calendar-cloud one">☁️</div>
                <div class="scene calendar-cloud two">☁️</div>

                <div class="scene calendar-plane">✈️</div>

                <div class="scene dog">🐶</div>
                <div class="scene tree">🌳</div>

                <!-- flower near 9 -->
                <div class="scene flower-one">🌸</div>

                <!-- cow near 1 -->
                <div class="scene cow">🐮</div>

                <div class="weekdays">
                    <div class="weekday">SUN</div>
                    <div class="weekday">MON</div>
                    <div class="weekday">TUE</div>
                    <div class="weekday">WED</div>
                    <div class="weekday">THU</div>
                    <div class="weekday">FRI</div>
                    <div class="weekday">SAT</div>
                </div>

                <div class="days" id="days"></div>

            </div>
        </div>

        <div class="question">
            Which date is hiding the secret? ♡
        </div>

        <div class="colors">

            <div
                class="color-option color-pink"
                data-color="pink"
                title="Pink">
            </div>

            <div
                class="color-option color-blue"
                data-color="blue"
                title="Blue">
            </div>

            <div
                class="color-option color-yellow"
                data-color="yellow"
                title="Yellow">
            </div>

            <div
                class="color-option color-white"
                data-color="white"
                title="White">
            </div>

        </div>

        <div class="message" id="message"></div>

        <!-- AIRPLANE DRAG AREA -->
        <div class="plane-area">

            <div class="plane-track" id="planeTrack">

                <div
                    class="drag-plane"
                    id="dragPlane"
                    role="button"
                    aria-label="Drag airplane to continue">
                    ✈️
                </div>

            </div>

            <div class="plane-message">
                Fly to the right when you're ready ♡
            </div>

        </div>

    </div>

</div>


<script>
/* =====================================================
   CALENDAR
===================================================== */

const daysContainer = document.getElementById("days");

const firstDay = 0; // February 1, 2026 is Sunday
const totalDays = 28;

let selectedDate = null;
let selectedColor = null;

for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement("div");
    empty.className = "day empty";
    daysContainer.appendChild(empty);
}

for (let day = 1; day <= totalDays; day++) {

    const dayElement = document.createElement("div");

    dayElement.className = "day";
    dayElement.textContent = day;

    dayElement.dataset.day = day;

    dayElement.addEventListener("click", function () {

        document.querySelectorAll(".day").forEach(d => {
            d.classList.remove("selected");
        });

        this.classList.add("selected");

        selectedDate = String(day);

        animateCalendar();
        clearMessage();
    });

    daysContainer.appendChild(dayElement);
}


/* =====================================================
   COLOR SELECTION
===================================================== */

const colorOptions =
    document.querySelectorAll(".color-option");

colorOptions.forEach(option => {

    option.addEventListener("click", function () {

        colorOptions.forEach(c => {
            c.classList.remove("selected");
        });

        this.classList.add("selected");

        selectedColor = this.dataset.color;

        clearMessage();
    });

});


/* =====================================================
   CALENDAR ANIMATION
===================================================== */

const calendar =
    document.getElementById("calendar");

function animateCalendar() {

    calendar.classList.remove("paper-rocket");

    void calendar.offsetWidth;

    calendar.classList.add("paper-rocket");

    setTimeout(() => {
        calendar.classList.remove("paper-rocket");
    }, 850);
}


/* =====================================================
   MESSAGE
===================================================== */

const message =
    document.getElementById("message");

function clearMessage() {
    message.textContent = "";
    message.classList.remove("shake");
}

function showWrongAnswer() {

    message.textContent =
        "Hmm... that's not the secret yet ♡";

    message.classList.remove("shake");

    void message.offsetWidth;

    message.classList.add("shake");

}


/* =====================================================
   AIRPLANE DRAG SYSTEM
===================================================== */

const planeTrack =
    document.getElementById("planeTrack");

const dragPlane =
    document.getElementById("dragPlane");

const mainBox =
    document.getElementById("mainBox");


let isDragging = false;
let startPointerX = 0;
let startPlaneLeft = 0;

let currentPlaneLeft = 8;

const START_POSITION = 8;


/* Get airplane boundaries */

function getPlaneLimits() {

    const trackWidth =
        planeTrack.clientWidth;

    const planeWidth =
        dragPlane.offsetWidth;

    const minLeft = 8;

    const maxLeft =
        trackWidth - planeWidth - 8;

    return {
        minLeft,
        maxLeft
    };
}


/* Set airplane position */

function setPlanePosition(left) {

    const limits =
        getPlaneLimits();

    left = Math.max(
        limits.minLeft,
        Math.min(left, limits.maxLeft)
    );

    currentPlaneLeft = left;

    dragPlane.style.left =
        left + "px";
}


/* =====================================================
   SMOOTH RETURN
===================================================== */

function returnPlaneToStart() {

    isDragging = false;

    dragPlane.classList.remove("dragging");

    /*
       Re-enable the smooth CSS transition.
    */

    dragPlane.style.transition =
        "left 1.25s cubic-bezier(.22,.61,.36,1), transform .2s ease";

    dragPlane.style.left =
        START_POSITION + "px";

    currentPlaneLeft =
        START_POSITION;

    /*
       Keep the transition active long enough
       to complete the movement.
    */

    setTimeout(() => {

        if (!isDragging) {

            dragPlane.style.transition =
                "left 1.25s cubic-bezier(.22,.61,.36,1), transform .2s ease";

        }

    }, 1300);
}


/* =====================================================
   POINTER DOWN
===================================================== */

dragPlane.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();

        isDragging = true;

        dragPlane.classList.add("dragging");

        /*
           Completely remove the return animation
           while the user is dragging.
        */

        dragPlane.style.transition = "none";

        startPointerX =
            event.clientX;

        startPlaneLeft =
            currentPlaneLeft;

        try {
            dragPlane.setPointerCapture(
                event.pointerId
            );
        } catch (e) {}

    }
);


/* =====================================================
   POINTER MOVE
===================================================== */

dragPlane.addEventListener(
    "pointermove",
    function(event) {

        if (!isDragging) {
            return;
        }

        event.preventDefault();

        const difference =
            event.clientX - startPointerX;

        const newLeft =
            startPlaneLeft + difference;

        setPlanePosition(newLeft);

    }
);


/* =====================================================
   POINTER UP
===================================================== */

dragPlane.addEventListener(
    "pointerup",
    function(event) {

        if (!isDragging) {
            return;
        }

        event.preventDefault();

        isDragging = false;

        dragPlane.classList.remove("dragging");

        try {
            dragPlane.releasePointerCapture(
                event.pointerId
            );
        } catch (e) {}

        checkPlaneDestination();

    }
);


/* =====================================================
   POINTER CANCEL
===================================================== */

dragPlane.addEventListener(
    "pointercancel",
    function() {

        if (!isDragging) {
            return;
        }

        isDragging = false;

        dragPlane.classList.remove("dragging");

        returnPlaneToStart();

    }
);


/* =====================================================
   CHECK DESTINATION
===================================================== */

function checkPlaneDestination() {

    const limits =
        getPlaneLimits();

    /*
       Require the airplane to travel
       about 85% of the track.
    */

    const destination =
        limits.minLeft +
        (limits.maxLeft - limits.minLeft) * 0.85;

    if (currentPlaneLeft >= destination) {

        /*
           Snap gently to the destination first.
        */

        dragPlane.style.transition =
            "left .35s ease-out";

        dragPlane.style.left =
            limits.maxLeft + "px";

        currentPlaneLeft =
            limits.maxLeft;

        setTimeout(() => {
            unlockPage();
        }, 350);

    } else {

        /*
           Not far enough:
           smoothly return to beginning.
        */

        returnPlaneToStart();

    }
}


/* =====================================================
   CHECK ANSWER
===================================================== */

function unlockPage() {

    /*
       Correct answer:
       February 13 + White
    */

    if (
        selectedDate === "13" &&
        selectedColor === "white"
    ) {

        message.textContent =
            "You found it... ♡";

        mainBox.classList.add("leaving");

        setTimeout(() => {

            window.location.href =
                "birthday.html";

        }, 700);

        return;
    }


    /*
       Wrong or incomplete answer.
    */

    showWrongAnswer();

    /*
       Wait a tiny moment so the message appears,
       then fly the airplane back smoothly.
    */

    setTimeout(() => {

        returnPlaneToStart();

    }, 250);
}


/* =====================================================
   INITIAL POSITION
===================================================== */

function resetPlane() {

    isDragging = false;

    dragPlane.classList.remove("dragging");

    dragPlane.style.transition = "none";

    currentPlaneLeft =
        START_POSITION;

    dragPlane.style.left =
        START_POSITION + "px";

    /*
       Force browser to register initial position
       before restoring transition.
    */

    void dragPlane.offsetWidth;

    dragPlane.style.transition =
        "left 1.25s cubic-bezier(.22,.61,.36,1), transform .2s ease";
}


window.addEventListener(
    "load",
    function() {
        resetPlane();
    }
);


/* =====================================================
   PAGE SHOW
===================================================== */

window.addEventListener(
    "pageshow",
    function() {

        selectedDate = null;
        selectedColor = null;

        document.querySelectorAll(".day").forEach(day => {
            day.classList.remove("selected");
        });

        colorOptions.forEach(color => {
            color.classList.remove("selected");
        });

        clearMessage();

        resetPlane();

    }
);


/* =====================================================
   PREVENT IMAGE / TEXT DRAG
===================================================== */

dragPlane.addEventListener(
    "dragstart",
    function(event) {
        event.preventDefault();
    }
);

</script>

</body>
</html>
