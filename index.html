
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Surprise ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at 20% 20%, #ffb6c9, transparent 35%),
                radial-gradient(circle at 80% 80%, #c8a7ff, transparent 35%),
                linear-gradient(135deg, #ff758c, #ff7eb3, #a18cd1);

            background-size: 200% 200%;
            animation: backgroundMove 10s ease infinite;
        }

        /* Moving background */
        @keyframes backgroundMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Main card */
        .password-box {
            position: relative;
            z-index: 10;

            width: 90%;
            max-width: 400px;

            padding: 45px 30px;

            text-align: center;

            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, 0.35);

            border-radius: 30px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.2),
                inset 0 0 30px rgba(255, 255, 255, 0.15);

            animation: cardAppear 1.2s cubic-bezier(.17,.67,.3,1.3);
        }

        @keyframes cardAppear {
            0% {
                opacity: 0;
                transform: translateY(50px) scale(0.8);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Lock */
        .lock {
            font-size: 65px;

            display: inline-block;

            margin-bottom: 15px;

            animation:
                lockFloat 3s ease-in-out infinite,
                lockGlow 2s ease-in-out infinite;
        }

        @keyframes lockFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes lockGlow {
            0%, 100% {
                filter: drop-shadow(0 0 5px rgba(255,255,255,0.5));
            }

            50% {
                filter: drop-shadow(0 0 20px rgba(255,255,255,0.9));
            }
        }

        h1 {
            color: white;

            font-size: 30px;

            margin-bottom: 10px;

            text-shadow:
                0 3px 10px rgba(0, 0, 0, 0.2);

            animation: textFade 1.5s ease;
        }

        .message {
            color: rgba(255, 255, 255, 0.9);

            font-size: 15px;

            margin-bottom: 25px;

            animation: textFade 1.8s ease;
        }

        @keyframes textFade {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Password input */
        .input-container {
            position: relative;
        }

        input {
            width: 100%;

            padding: 16px 18px;

            border: none;

            border-radius: 15px;

            outline: none;

            font-size: 16px;

            text-align: center;

            color: #555;

            background: rgba(255, 255, 255, 0.92);

            transition: all 0.3s ease;
        }

        input:focus {
            transform: scale(1.03);

            box-shadow:
                0 0 0 3px rgba(255,255,255,0.3),
                0 8px 25px rgba(0,0,0,0.15);
        }

        /* Hint */
        .hint {
            color: rgba(255,255,255,0.85);

            font-size: 13px;

            margin-top: 10px;

            margin-bottom: 5px;
        }

        .hint span {
            font-weight: bold;

            color: white;
        }

        /* Button */
        button {
            width: 100%;

            margin-top: 15px;

            padding: 16px;

            border: none;

            border-radius: 15px;

            background: rgba(255,255,255,0.95);

            color: #e75480;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px) scale(1.02);

            box-shadow:
                0 10px 25px rgba(0,0,0,0.2);
        }

        button:active {
            transform: scale(0.96);
        }

        /* Error */
        #error {
            color: white;

            font-size: 14px;

            margin-top: 15px;

            display: none;

            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-8px);
            }

            75% {
                transform: translateX(8px);
            }
        }

        /* Floating hearts */
        .heart {
            position: absolute;

            bottom: -50px;

            color: rgba(255,255,255,0.7);

            font-size: 20px;

            pointer-events: none;

            animation: floatHeart linear infinite;
        }

        @keyframes floatHeart {

            0% {
                transform:
                    translateY(0)
                    rotate(0deg)
                    scale(0.8);

                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            50% {
                transform:
                    translateY(-50vh)
                    rotate(180deg)
                    scale(1.1);
            }

            100% {
                transform:
                    translateY(-110vh)
                    rotate(360deg)
                    scale(0.7);

                opacity: 0;
            }
        }

        /* Small stars */
        .star {
            position: absolute;

            width: 4px;
            height: 4px;

            background: white;

            border-radius: 50%;

            opacity: 0.7;

            animation: twinkle 2s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            from {
                opacity: 0.2;
                transform: scale(0.5);
            }

            to {
                opacity: 1;
                transform: scale(1.5);
            }
        }

    </style>
</head>

<body>

    <!-- Floating hearts -->
    <div class="heart" style="left: 10%; animation-duration: 8s; animation-delay: 0s;">❤️</div>
    <div class="heart" style="left: 25%; animation-duration: 11s; animation-delay: 2s;">💕</div>
    <div class="heart" style="left: 40%; animation-duration: 9s; animation-delay: 4s;">💗</div>
    <div class="heart" style="left: 60%; animation-duration: 12s; animation-delay: 1s;">💖</div>
    <div class="heart" style="left: 75%; animation-duration: 10s; animation-delay: 3s;">💕</div>
    <div class="heart" style="left: 90%; animation-duration: 13s; animation-delay: 5s;">❤️</div>


    <!-- Stars -->
    <div class="star" style="top: 15%; left: 20%;"></div>
    <div class="star" style="top: 30%; left: 85%; animation-delay: .5s;"></div>
    <div class="star" style="top: 70%; left: 10%; animation-delay: 1s;"></div>
    <div class="star" style="top: 80%; left: 90%; animation-delay: 1.5s;"></div>
    <div class="star" style="top: 10%; left: 70%; animation-delay: .8s;"></div>


    <!-- Password Card -->
    <div class="password-box">

        <div class="lock">🔐</div>

        <h1>A Little Surprise</h1>

        <p class="message">
            This little secret is just for you...
        </p>

        <div class="input-container">

            <input
                type="password"
                id="password"
                placeholder="Enter the password"
                autocomplete="off"
            >

        </div>

        <p class="hint">
            💡 Hint: <span>Kaw</span>
        </p>

        <button onclick="checkPassword()">
            Unlock My Surprise 💕
        </button>

        <div id="error">
            Hmm... that's not the password ❤️
        </div>

    </div>


    <script>

        function checkPassword() {

            const password =
                document.getElementById("password").value;

            // Your password
            const correctPassword = "birthday";

            if (password === correctPassword) {

                // Small success animation
                document.querySelector(".password-box").style.transform =
                    "scale(1.08)";

                document.querySelector(".password-box").style.transition =
                    "0.5s ease";

                setTimeout(() => {

                    window.location.href = "birthday.html";

                }, 600);

            } else {

                const error =
                    document.getElementById("error");

                error.style.display = "block";

                // Restart shake animation
                error.style.animation = "none";

                void error.offsetWidth;

                error.style.animation = "shake 0.4s ease";
            }
        }


        // Press Enter to unlock
        document
            .getElementById("password")
            .addEventListener("keypress", function(event) {

                if (event.key === "Enter") {

                    checkPassword();

                }

            });

    </script>

</body>
</html>
