<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Secret ♡</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --main: #d96b88;
            --light: #fff7f9;
            --soft: #f7dce4;
            --text: #604953;
            --white: #ffffff;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                "Segoe Print",
                "Bradley Hand",
                "Comic Sans MS",
                cursive;

            color: var(--text);

            background: #fff7f9;

            cursor: default;
        }

        /* --------------------------------
           SOFT MOVING BACKGROUND
        -------------------------------- */

        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;

            left: -180px;
            top: -180px;

            background: var(--soft);

            border-radius: 50%;

            opacity: 0.55;

            animation: softFloat 9s ease-in-out infinite;

            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            width: 450px;
            height: 450px;

            right: -180px;
            bottom: -180px;

            background: #f3e1e6;

            border-radius: 50%;

            opacity: 0.6;

            animation: softFloat2 11s ease-in-out infinite;

            pointer-events: none;
        }

        @keyframes softFloat {
            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(50px, 30px);
            }
        }

        @keyframes softFloat2 {
            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-40px, -25px);
            }
        }

        /* --------------------------------
           SMALL CURSOR TRAIL
        -------------------------------- */

        .cursor-dot {
            position: fixed;

            width: 8px;
            height: 8px;

            background: var(--main);

            border-radius: 50%;

            pointer-events: none;

            transform: translate(-50%, -50%);

            opacity: 0.5;

            z-index: 9999;

            animation: cursorFade 0.7s ease-out forwards;
        }

        @keyframes cursorFade {
            0% {
                transform:
                    translate(-50%, -50%)
                    scale(1);
                opacity: 0.5;
            }

            100% {
                transform:
                    translate(-50%, -50%)
                    scale(0);
                opacity: 0;
            }
        }

        /* --------------------------------
           MAIN CARD
        -------------------------------- */

        .box {
            position: relative;
            z-index: 10;

            width: min(94%, 430px);

            padding: 28px 22px 25px;

            background: rgba(255, 255, 255, 0.93);

            border: 1px solid var(--soft);

            border-radius: 28px;

            box-shadow:
                0 20px 60px rgba(80, 40, 50, 0.12);

            text-align: center;

            animation: boxAppear 1s cubic-bezier(.2,.8,.2,1);

            transition:
                transform 0.4s ease,
                box-shadow 0.4s ease;
        }

        .box:hover {
            transform: translateY(-4px);

            box-shadow:
                0 25px 70px rgba(80, 40, 50, 0.16);
        }

        @keyframes boxAppear {
            from {
                opacity: 0;
                transform:
                    translateY(35px)
                    scale(0.94);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        /* --------------------------------
           TITLE
        -------------------------------- */

        .tiny-heart {
            font-size: 24px;

            animation: heartBeat 2s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.18);
            }
        }

        h1 {
            margin-top: 5px;

            color: var(--main);

            font-size: 27px;

            font-weight: 600;

            letter-spacing: 0.5px;
        }

        .subtitle {
            margin-top: 5px;

            font-size: 13px;

            color: #8b737b;
        }

        /* --------------------------------
           CALENDAR
        -------------------------------- */

        .calendar {
            margin-top: 20px;

            padding: 16px;

            background: var(--light);

            border-radius: 20px;

            border: 1px solid var(--soft);

            transition: transform 0.3s ease;
        }

        .calendar:hover {
            transform: scale(1.015);
        }

        .calendar-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 12px;

            color: var(--main);

            font-size: 18px;

            font-weight: bold;
        }

        .calendar-header span {
            font-size: 13px;

            color: #9b7e87;

            font-weight: normal;
        }

        .days {
            display: grid;

            grid-template-columns:
                repeat(7, 1fr);

            gap: 5px;
        }

        .day-name {
            font-size: 10px;

            color: #a1848d;

            padding-bottom: 4px;
        }

        .day {
            position: relative;

            min-height: 38px;

            display: flex;

            justify-content: center;

            align-items: center;

            border-radius: 10px;

            font-size: 13px;

            color: var(--text);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        /* Empty calendar spaces */
        .empty {
            min-height: 38px;
        }

        /* Day hover / finger movement */
        .day:not(.empty):hover {
            transform:
                translateY(-4px)
                scale(1.08);

            background: white;

            box-shadow:
                0 5px 14px rgba(100, 50, 65, 0.12);

            z-index: 2;
        }

        /* Special day */
        .special {
            background: var(--main);

            color: white !important;

            font-weight: bold;

            box-shadow:
                0 6px 15px rgba(217, 107, 136, 0.28);

            animation:
                specialPulse 2.5s ease-in-out infinite;
        }

        @keyframes specialPulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        .special::after {
            content: "♡";

            position: absolute;

            right: 2px;
            top: -7px;

            font-size: 12px;

            color: var(--main);

            animation: tinyFloat 1.8s ease-in-out infinite;
        }

        @keyframes tinyFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-3px);
            }
        }

        /* --------------------------------
           CUTE CALENDAR DECORATIONS
        -------------------------------- */

        .calendar-decoration {
            position: absolute;

            font-size: 17px;

            pointer-events: none;

            animation: decorationFloat 3s ease-in-out infinite;
        }

        .dog {
            left: 8px;
            bottom: 8px;
        }

        .plane {
            right: 8px;
            top: 8px;
            animation-delay: 0.5s;
        }

        .tree {
            left: 45%;
            top: -9px;
            font-size: 15px;
            animation-delay: 1s;
        }

        .flower {
            right: 28px;
            bottom: 8px;
            animation-delay: 1.5s;
        }

        @keyframes decorationFloat {
            0%, 100% {
                transform: translateY(0) rotate(-3deg);
            }

            50% {
                transform: translateY(-4px) rotate(3deg);
            }
        }

        /* --------------------------------
           HINT
        -------------------------------- */

        .hint {
            margin-top: 15px;

            font-size: 13px;

            color: #806b72;

            line-height: 1.6;
        }

        .hint strong {
            color: var(--main);

            font-weight: 600;
        }

        /* --------------------------------
           PASSWORD INPUT
        -------------------------------- */

        input {
            width: 100%;

            margin-top: 12px;

            padding: 14px;

            border: 1px solid var(--soft);

            border-radius: 13px;

            outline: none;

            background: white;

            color: var(--text);

            font-family: inherit;

            font-size: 15px;

            text-align: center;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border 0.25s ease;
        }

        input::placeholder {
            color: #b29ca3;
        }

        input:focus {
            border-color: var(--main);

            transform: scale(1.02);

            box-shadow:
                0 5px 20px rgba(217, 107, 136, 0.12);
        }

        /* --------------------------------
           BUTTON
        -------------------------------- */

        button {
            width: 100%;

            margin-top: 12px;

            padding: 14px;

            border: none;

            border-radius: 13px;

            background: var(--main);

            color: white;

            font-family: inherit;

            font-size: 15px;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        button:hover {
            transform:
                translateY(-3px)
                scale(1.02);

            box-shadow:
                0 8px 20px rgba(217, 107, 136, 0.25);
        }

        button:active {
            transform: scale(0.96);
        }

        /* --------------------------------
           ERROR
        -------------------------------- */

        #error {
            display: none;

            margin-top: 10px;

            font-size: 12px;

            color: var(--main);

            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-7px);
            }

            75% {
                transform: translateX(7px);
            }
        }

        /* --------------------------------
           MOBILE
        -------------------------------- */

        @media (max-width: 420px) {

            .box {
                padding: 23px 15px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .calendar {
                padding: 12px;
            }

            .day {
                min-height: 35px;
                font-size: 12px;
            }

            .empty {
                min-height: 35px;
            }
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="tiny-heart">♡</div>

        <h1>A Little Secret</h1>

        <p class="subtitle">
            Some days are more special than others...
        </p>


        <!-- CALENDAR -->

        <div class="calendar">

            <div class="calendar-header">
                <span>♡</span>

                February 2026

                <span>♡</span>
            </div>


            <div class="days">

                <!-- Week names -->

                <div class="day-name">Sun</div>
                <div class="day-name">Mon</div>
                <div class="day-name">Tue</div>
                <div class="day-name">Wed</div>
                <div class="day-name">Thu</div>
                <div class="day-name">Fri</div>
                <div class="day-name">Sat</div>


                <!-- February 2026 starts Sunday -->

                <div class="day">1</div>
                <div class="day">2</div>
                <div class="day">3</div>
                <div class="day">4</div>
                <div class="day">5</div>
                <div class="day">6</div>
                <div class="day">7</div>

                <div class="day">8</div>
                <div class="day">9</div>
                <div class="day">10</div>
                <div class="day">11</div>
                <div class="day">12</div>

                <!-- SPECIAL DAY -->

                <div class="day special">13</div>

                <div class="day">14</div>

                <div class="day">15</div>
                <div class="day">16</div>
                <div class="day">17</div>
                <div class="day">18</div>
                <div class="day">19</div>
                <div class="day">20</div>
                <div class="day">21</div>

                <div class="day">22</div>
                <div class="day">23</div>
                <div class="day">24</div>
                <div class="day">25</div>
                <div class="day">26</div>
                <div class="day">27</div>
                <div class="day">28</div>

            </div>


            <!-- Cute little decorations -->

            <div class="calendar-decoration dog">🐶</div>

            <div class="calendar-decoration plane">✈️</div>

            <div class="calendar-decoration tree">🌳</div>

            <div class="calendar-decoration flower">🌷</div>

        </div>


        <!-- HINT -->

        <p class="hint">
            🌷 <strong>A little clue...</strong><br>
            the day our story first began ✈️🐶
        </p>


        <!-- PASSWORD -->

        <input
            type="password"
            id="password"
            placeholder="Enter the special date..."
            autocomplete="off"
        >


        <button onclick="checkPassword()">
            Unlock ♡
        </button>


        <div id="error">
            Almost... try the special date again ♡
        </div>

    </div>


    <script>

        /* --------------------------------
           PASSWORD
        -------------------------------- */

        function checkPassword() {

            const password =
                document.getElementById("password").value.trim();

            /*
                The password is:
                2026 Feb 13
            */

            const correctPassword = "2026 Feb 13";

            const error =
                document.getElementById("error");


            if (password === correctPassword) {

                const box =
                    document.querySelector(".box");

                box.style.transform =
                    "scale(1.06)";

                box.style.opacity = "0";

                box.style.transition =
                    "all 0.7s ease";


                setTimeout(() => {

                    window.location.href =
                        "birthday.html";

                }, 700);

            } else {

                error.style.display = "block";

                error.style.animation = "none";

                void error.offsetWidth;

                error.style.animation =
                    "shake 0.4s ease";
            }
        }


        /* --------------------------------
           ENTER KEY
        -------------------------------- */

        document
            .getElementById("password")
            .addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {
                        checkPassword();
                    }

                }
            );


        /* --------------------------------
           CURSOR ANIMATION
        -------------------------------- */

        let lastCursorTime = 0;

        document.addEventListener(
            "mousemove",
            function(event) {

                const now = Date.now();

                /*
                    Limit the number of dots so
                    the animation stays smooth.
                */

                if (now - lastCursorTime < 45) {
                    return;
                }

                lastCursorTime = now;


                const dot =
                    document.createElement("div");

                dot.className =
                    "cursor-dot";

                dot.style.left =
                    event.clientX + "px";

                dot.style.top =
                    event.clientY + "px";


                document.body.appendChild(dot);


                setTimeout(() => {

                    dot.remove();

                }, 700);

            }
        );


        /* --------------------------------
           TOUCH / FINGER MOVEMENT
        -------------------------------- */

        document.addEventListener(
            "touchmove",
            function(event) {

                const touch =
                    event.touches[0];

                if (!touch) return;


                const dot =
                    document.createElement("div");

                dot.className =
                    "cursor-dot";

                dot.style.left =
                    touch.clientX + "px";

                dot.style.top =
                    touch.clientY + "px";


                document.body.appendChild(dot);


                setTimeout(() => {

                    dot.remove();

                }, 700);

            },
            { passive: true }
        );


        /* --------------------------------
           CALENDAR DAY INTERACTION
        -------------------------------- */

        const days =
            document.querySelectorAll(
                ".day:not(.empty)"
            );


        days.forEach(day => {

            day.addEventListener(
                "pointerenter",
                function() {

                    if (!this.classList.contains("special")) {

                        this.style.transform =
                            "translateY(-4px) scale(1.08)";

                    }

                }
            );


            day.addEventListener(
                "pointerleave",
                function() {

                    if (!this.classList.contains("special")) {

                        this.style.transform =
                            "";

                    }

                }
            );

        });

    </script>

</body>
</html>
