```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Surprise ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            font-family: Arial, sans-serif;
        }

        .password-box {
            width: 90%;
            max-width: 400px;
            padding: 40px 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .heart {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            color: #e75480;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #f3a6b8;
            border-radius: 12px;
            outline: none;
            font-size: 16px;
            text-align: center;
        }

        input:focus {
            border-color: #e75480;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #e75480;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #d94370;
        }

        #error {
            color: #e63946;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="password-box">

        <div class="heart">❤️</div>

        <h1>A Little Surprise</h1>

        <p>This little website is just for you...</p>

        <input
            type="password"
            id="password"
            placeholder="Enter the password"
        >

        <button onclick="checkPassword()">
            Unlock 🔐
        </button>

        <div id="error">
            Wrong password ❤️
        </div>

    </div>

    <script>
        function checkPassword() {

            const password = document.getElementById("password").value;

            // Change this password
            const correctPassword = "birthday";

            if (password === correctPassword) {

                // Open the birthday page
                window.location.href = "birthday.html";

            } else {

                document.getElementById("error").style.display = "block";

            }
        }
    </script>

</body>
</html>
